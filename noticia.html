<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualidad | Pucón Creativo</title><style>
:root{--navy:#1b2459;--pink:#ef82a8}*{box-sizing:border-box}body{margin:0;background:#fbf8f5;color:#333b56;font:16px/1.7 Inter,system-ui,Arial,sans-serif}header{border-bottom:1px solid #e4d9df;background:white;padding:13px max(24px,calc((100vw - 900px)/2))}header a{display:flex;gap:16px;align-items:center;color:var(--navy);font-weight:850;text-decoration:none}header img{width:54px;height:61px;object-fit:contain}main{max-width:900px;margin:70px auto;padding:0 24px 80px}h1{color:var(--navy);font-size:clamp(38px,6vw,70px);line-height:1.02;letter-spacing:-.05em;margin:16px 0}.fecha{color:#bb426f;font-size:13px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.resumen{font-size:21px;color:#505675;max-width:740px}.contenido{white-space:pre-line;margin-top:30px;max-width:740px}.image{width:100%;height:auto;max-height:520px;object-fit:cover;margin:28px 0}footer{text-align:center;padding:30px;background:var(--navy);color:white;font-size:13px}.back{display:inline-block;color:var(--navy);text-decoration:underline;text-underline-offset:4px}</style></head><body>
<header><a href="/"><img src="assets/logo-pucon-creativo.png" alt="Logo Pucón Creativo">PUCÓN CREATIVO</a></header>
<main><a href="/#actualidad" class="back">← Volver a actualidad</a><article id="contenido"><h1>Actualidad</h1><p>Cargando noticia...</p></article></main><footer>Pucón Creativo · Red de Economías Creativas</footer>
<script>
(async function(){const params=new URLSearchParams(location.search),slug=params.get('slug'),root=document.getElementById('contenido');try{const r=await fetch('content/noticias.json');if(!r.ok)throw Error();const data=await r.json(),n=data.find(x=>x&&x.publicado===true&&x.slug===slug);if(!n)throw Error();root.replaceChildren();const add=(tag,cls,text)=>{let e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;root.append(e);return e};add('div','fecha',n.fecha||'Actualidad');add('h1','',n.titulo);add('p','resumen',n.resumen||'');if(n.imagen){try{let u=new URL(n.imagen,location.origin);if(['https:','http:'].includes(u.protocol)){const img=document.createElement('img');img.className='image';img.src=u.href;img.alt='Imagen de '+n.titulo;root.append(img)}}catch(e){}}add('div','contenido',n.contenido||'');document.title=n.titulo+' | Pucón Creativo';}catch(_){root.replaceChildren();const h=document.createElement('h1');h.textContent='Noticia no disponible';root.append(h)}})();
</script></body></html>
